# Project Factory's OWN Postgres — stores LangGraph checkpoints (agent state).
#
# Deliberately separate from any project's app DB: resetting a project database
# must never destroy run state, and vice versa.
#
#   docker compose -f docker/docker-compose.state.yml up -d
#
# DETERMINISM: pin by digest once you have pulled it locally:
#   docker image inspect postgres:16.4-alpine --format '{{index .RepoDigests 0}}'
# then replace the image line with  postgres@sha256:<digest>

services:
  state:
    image: postgres:16.4-alpine
    container_name: project-factory-state
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: project_factory_state
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"        # 5433 on the host — leaves 5432 free for project DBs
    volumes:
      - project_factory_state:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d project_factory_state"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  project_factory_state:
