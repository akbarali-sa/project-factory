# =============================================================================
# EXEMPLAR ORACLE — the quality bar for agent-drafted scenarios.
#
# Its STRUCTURE and RIGOR are distilled from the human-authored oracle of the
# first successful factory run. Its DOMAIN is deliberately FICTIONAL — a field
# herbarium digitisation app (folios of pressed-plant specimen sheets) chosen
# so that no real client project will share its vocabulary. The fictional
# nouns are canaries: validate_oracle REJECTS any draft that contains them
# for a project whose board does not, so copying this file's content (rather
# than its form) is mechanically detectable.
#
# Copy from this file: structure, precision of given/when/then, explicit
# rejection paths, test-data strategy, provisional discipline, out-of-scope
# honesty. Do NOT copy: the domain, the nouns, or even the workflow shape —
# a file-upload ingestion slice is what THIS fictional slice happens to be,
# not what your slice should look like. Your shape comes from the board.
# =============================================================================

slice:
  id: slice_folio_specimen_sheet
  name: Folio registration & specimen sheet ingestion
  wave: 1
  bounded_context: Specimen Sheet Ingestion
  approved_by: null
  approved_at: null

aggregates:
  - Folio
  - SpecimenSheet
  - SpecimenEntry

# starter_constraints: supplied separately in the prompt (starter-kit truth,
# maintained in exemplars/starter-constraints.yaml). Include that block
# VERBATIM in your draft — validation rejects a draft that alters it.

scenarios:

  - id: SC-001
    title: Curator uploads a valid specimen sheet and the folio is registered
    traces_to: [be_specimen_sheet_uploaded, be_folio_registered]
    given:
      - No folio exists with reference "F-1001"
      - An Excel specimen sheet with 2 rows: (TAXON-001, accession A-001, count 250), (TAXON-002, accession A-002, count 120)
    when: Curator uploads the file for folio reference "F-1001"
    then:
      - HTTP 201 is returned
      - A Folio record exists with reference "F-1001"
      - A SpecimenSheet is linked to that Folio
      - Exactly 2 SpecimenEntry rows exist with the given taxa, accessions and counts
      - Event SpecimenSheetUploaded is emitted
      - Event FolioRegistered is emitted

  - id: SC-002
    title: Re-uploading the same specimen sheet updates rather than duplicates
    traces_to: [be_folio_registered]
    given:
      - Folio "F-1001" already exists with 2 specimen entries
    when: Curator uploads a revised file for "F-1001" where TAXON-001 count is 260
    then:
      - HTTP 200 is returned
      - Still exactly one Folio with reference "F-1001"
      - Still exactly 2 SpecimenEntry rows (no duplication)
      - TAXON-001 count is 260
    notes: >
      Covers the "registers/updates" wording in the board. Idempotency matters
      because collectors re-send corrected specimen sheets.

  - id: SC-003
    title: Duplicate accession within the same folio is rejected
    traces_to: [be_specimen_sheet_uploaded]
    given:
      - An Excel specimen sheet where two rows share accession "A-001"
    when: Curator uploads the file for folio "F-1002"
    then:
      - HTTP 422 is returned
      - The response identifies the duplicated accession "A-001" and the offending row numbers
      - No Folio "F-1002" is persisted
      - No partial SpecimenEntry rows are persisted
    notes: Enforces the unique constraint (accession, folio_id). Must be transactional.

  - id: SC-007
    title: Only Curator may upload a specimen sheet
    traces_to: [be_specimen_sheet_uploaded]
    depends_on_schema_change: true
    given:
      - A user authenticated with the FieldAssistant role
    when: They attempt to upload a specimen sheet
    then:
      - HTTP 403 is returned
      - Nothing is persisted
    notes: >
      REQUIRES A SCHEMA CHANGE. The starter's User model has no role field, so
      the Architect must add one and the seed must produce at least one Curator
      and one FieldAssistant. Flag this explicitly at Gate B — it is the one
      place this slice extends the template's auth model.

web_scenarios:

  - id: WEB-001
    title: Upload form renders and validates before submit
    screen: /folios/upload
    given: A Curator is on the specimen sheet upload screen
    when: They submit with no file selected
    then:
      - An inline validation message names the missing file
      - No network request is made
      - The submit button is disabled while no file is chosen

  - id: WEB-005
    title: Upload screen is keyboard accessible
    screen: /folios/upload
    given: A Curator using keyboard navigation only
    when: They tab through the form
    then:
      - The file input and submit control are both reachable
      - The file input has an associated label
      - Error messages are announced (aria-live or role=alert)

e2e_scenarios:

  - id: E2E-001
    title: Curator uploads a real specimen sheet end to end and data persists
    traces_to: [SC-001, WEB-002]
    given:
      - The stack is running; db:reset has run so only seeded users exist
      - Signed in as john.doe@example.com (seeded, email-only login)
    when: Curator uploads a valid 2-row .xlsx for folio "F-1001" via the UI
    then:
      - The UI shows the success summary with 2 entries
      - Reloading the folio detail page still shows both entries (persisted)
      - GET /folios/F-1001 returns 2 specimen entries, ids exposed as `_id`

test_data:
  global_seed: >
    Layer 1 only — the starter's `pnpm init-db:force` seeds 3 demo users. This
    provides sign-in identity for E2E and nothing else.
  domain_fixtures: >
    Layer 2 — each test creates the domain rows it needs in its own arrange step.
    We deliberately do NOT add a global domain seed: shared mutable state makes
    tests order-dependent, and scenarios like SC-001 assert on an EMPTY starting
    state.
  isolation: >
    `pnpm db:reset` before the suite gives an identical starting database every
    run.
  fixture_files: >
    Files a test depends on (spreadsheets, images, exports) must be generated as
    real files under apps/api/__tests__/fixtures/ — not mocked — whenever parsing
    them is the behaviour under test.

provisional_scenarios:

  - id: SC-P01
    title: Accession-to-taxon match validation against a reference index
    traces_to: [UC-003]
    blocked_by: q_taxonomy_authority_selection_pending
    reason: >
      The board marks this provisional pending a client decision. Do NOT
      generate tests until the blocking question is answered.
    status: blocked

out_of_scope:
  - id: be_field_notes_synced
    reason: Offline sync + dropout recovery is the hard 10% — human-implemented.
  - id: ext_postal_courier
    reason: Off-system document delivery channel, not a build integration.

nfrs:
  - id: NFR-ingest-atomic
    statement: Ingestion is atomic — a rejected file leaves no partial rows.
    verified_at: slice_gate
    covered_by: [SC-003]
